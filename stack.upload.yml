version: "3.8"

# Opcional: pagina web de upload (arrastar-e-soltar) que grava direto na
# pasta de entrada do bot. Sobe junto com o stack principal:
#   docker stack deploy -c stack.yml -c stack.upload.yml transcritor
# (o deploy.sh faz isso sozinho quando UPLOAD_HOST esta no .env).
#
# A pagina NAO tem login. As labels abaixo sao pro Traefik e exigem um
# middleware que restrinja a origem (rede privada, IP allowlist, auth) —
# o padrao "tailnet-only" e proposital: sem esse middleware definido no seu
# proxy, o roteador nem sobe, e a pagina fica fechada em vez de aberta.
services:
  upload:
    image: transcritor:${TRANSCRITOR_TAG:-latest}
    command: ["node", "upload.js"]
    networks:
      - web
    environment:
      - TZ=America/Sao_Paulo
      - UPLOAD_MAX_MB=${UPLOAD_MAX_MB:-4000}
    volumes:
      # mesma pasta data/ do bot: o inbox e o elo entre os dois
      - ${APP_DIR:-/opt/transcritor}/data:/app/data
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          memory: 256M
      labels:
        - traefik.enable=true
        - traefik.docker.network=${WEB_NETWORK:?rede do proxy no .env}
        - traefik.http.routers.transcritor-up.rule=Host(`${UPLOAD_HOST:?host da pagina no .env}`)
        - traefik.http.routers.transcritor-up.entrypoints=websecure
        - traefik.http.routers.transcritor-up.tls.certresolver=${UPLOAD_CERTRESOLVER:-letsencryptresolver}
        - traefik.http.routers.transcritor-up.middlewares=${UPLOAD_MIDDLEWARES:-tailnet-only}
        - traefik.http.routers.transcritor-up.priority=${UPLOAD_PRIORITY:-100}
        - traefik.http.services.transcritor-up.loadbalancer.server.port=8090

networks:
  web:
    external: true
    name: ${WEB_NETWORK:?rede do proxy no .env}
