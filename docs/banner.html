<style>
  /* ============================================================
     transcritor — banner GitHub 1280x400
     Sistema: espacamento na escala 4/8/12/16/24/32/48/64;
     3 niveis de tipo (display/subtitulo/caption); 1 acento
     (gradiente amber->coral); raios na escala 3/16/999 (pill).
     ============================================================ */
  :root {
    /* cor — papeis semanticos */
    --bg:        #0B0D12;   /* fundo */
    --surface:   #141824;   /* superficie (chip do recibo) */
    --ink-hi:    #F4F6FA;   /* texto primario  (display)      ~17:1  */
    --ink-mid:   #A9B2C3;   /* texto secundario (subtitulo)   ~8.5:1 */
    --ink-low:   #8A93A6;   /* texto terciario (metadados)    ~6:1   */
    --line:      rgba(244,246,250,0.07);  /* fio interno da moldura */
    --accent:    #FFB224;   /* acento unico (amber) */
    --accent-2:  #FF7A48;   /* 2a parada do unico gradiente de acento */

    /* espacamento — somente a escala */
    --s-4: 4px; --s-8: 8px; --s-12: 12px; --s-16: 16px;
    --s-24: 24px; --s-32: 32px; --s-48: 48px; --s-64: 64px;

    /* tipografia — 3 niveis */
    --font-display: 'Space Grotesk', 'Segoe UI', sans-serif;
    --font-mono:    'JetBrains Mono', 'Cascadia Mono', monospace;
    --fs-display: 72px;  --lh-display: 1.05; --ls-display: -0.02em;
    --fs-sub:     20px;  --lh-sub: 1.5;
    --fs-caption: 12px;  --ls-caption: 0.12em;

    /* medidas compostas da cena visual (grade interna do SVG) */
    --visual-w: 544px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1280px; height: 400px; overflow: hidden;
    position: relative;
    background: var(--bg);
    box-shadow: inset 0 0 0 1px var(--line);
    font-family: var(--font-display);
    -webkit-font-smoothing: antialiased;
  }

  /* camada de fundo: cena onda->texto, sangra a altura toda a direita */
  .visual svg { overflow: visible; }  /* o glow radial sangra alem do viewBox de proposito */
  .visual {
    position: absolute;              /* razao composicional: fundo decorativo */
    top: 0; right: var(--s-64);
    width: var(--visual-w); height: 100%;
  }

  .chip-text {
    font-family: var(--font-mono);
    font-size: var(--fs-caption);
    letter-spacing: 0.02em;
    fill: var(--ink-mid);
  }
  .chip-cost { fill: var(--accent); font-weight: 600; }

  /* coluna editorial */
  .content {
    position: relative; z-index: 1;
    height: 100%;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 var(--s-64);
  }

  .eyebrow {
    display: flex; align-items: center; gap: var(--s-12);
    font-family: var(--font-mono);
    font-size: var(--fs-caption); font-weight: 600;
    letter-spacing: var(--ls-caption);
    color: var(--accent);
  }
  .eyebrow::before {
    content: '';
    width: var(--s-24); height: 2px; border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
  }

  h1 {
    margin: var(--s-16) 0;
    font-size: var(--fs-display); font-weight: 700;
    line-height: var(--lh-display); letter-spacing: var(--ls-display);
    color: var(--ink-hi);
  }

  .sub {
    max-width: 560px;
    font-size: var(--fs-sub); font-weight: 400;
    line-height: var(--lh-sub);
    color: var(--ink-mid);
  }
  .sub strong { font-weight: 400; color: var(--ink-hi); }  /* enfase por cor: nao sintetizar peso nao carregado */

  /* rodape de metadados — terciario, preso a base */
  .stack {
    position: absolute;              /* razao composicional: linha-base do banner */
    left: var(--s-64); bottom: var(--s-32);
    font-family: var(--font-mono);
    font-size: var(--fs-caption); font-weight: 400;
    letter-spacing: var(--ls-caption);
    color: var(--ink-low);
  }
</style>
